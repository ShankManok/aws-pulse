name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          npm ci
      - name: Lint
        run: |
          ruff check src/ tests/ sdk/python/ scripts/
          npm run build --workspace infra
      - name: Unit Tests
        run: pytest tests/unit/ tests/integration/ -v --cov=src --cov=sdk/python/pulse --cov-report=xml --cov-fail-under=100
      - name: CDK Synth
        run: npm test
      - name: Packaged Lambda imports
        run: python scripts/package_smoke.py infra/cdk.out
